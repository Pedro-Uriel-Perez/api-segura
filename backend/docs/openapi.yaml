openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: Secure task manager API with JWT access tokens and rotating refresh tokens.
servers:
  - url: https://api.example.com/api/v1
  - url: http://localhost:3000/api/v1
    description: Local development only
tags:
  - name: Auth
  - name: Tasks
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register an account and receive a token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        "201": { $ref: '#/components/responses/TokenPair' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "409": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200": { $ref: '#/components/responses/TokenPair' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token (reuse revokes the whole family)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "200": { $ref: '#/components/responses/TokenPair' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the refresh-token family of the supplied token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "204": { description: Logged out }
        "400": { $ref: '#/components/responses/ValidationError' }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every active refresh token of the authenticated user
      security:
        - bearerAuth: []
      responses:
        "204": { description: All sessions revoked }
        "401": { $ref: '#/components/responses/Error' }
  /tasks:
    get:
      tags: [Tasks]
      summary: List the current user's tasks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Current user's paginated tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      summary: Create a task owned by the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTask' }
      responses:
        "201": { $ref: '#/components/responses/TaskItem' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
  /tasks/{taskId}:
    parameters:
      - in: path
        name: taskId
        required: true
        schema: { type: string, pattern: '^c[a-z0-9]{20,32}$' }
    get:
      tags: [Tasks]
      summary: Get one owned task
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: '#/components/responses/TaskItem' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
    patch:
      tags: [Tasks]
      summary: Update an owned task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTask' }
      responses:
        "200": { $ref: '#/components/responses/TaskItem' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
    delete:
      tags: [Tasks]
      summary: Delete an owned task
      security:
        - bearerAuth: []
      responses:
        "204": { description: Task deleted }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 200 }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 600 }
    Task:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        page: { type: integer }
        limit: { type: integer }
    CreateTask:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, nullable: true }
    UpdateTask:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, nullable: true }
        completed: { type: boolean }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: UNAUTHENTICATED }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
  responses:
    TokenPair:
      description: Access and refresh token pair
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TokenPair' }
    TaskItem:
      description: A single task
      content:
        application/json:
          schema:
            type: object
            properties:
              item: { $ref: '#/components/schemas/Task' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Safe error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
